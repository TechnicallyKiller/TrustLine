services:
  - type: web
    name: trustline-backend
    runtime: node
    rootDir: backend
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: SCORE_SIGNER_SECRET
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: SCORE_REGISTRY_CONTRACT_ID
        value: CAZUPW5MWHG5XCE7BM6YP6M52NPB6TPRRAXU3GEV4TL2AR2ZMYE7TRSX
      - key: CREDIT_LINE_CONTRACT_ID
        value: CC4ZAKREYMCDEONIQMSSBYOBFC75LL5NPYVEBRZ5SACHYWLYGK2R7GDO
      - key: LENDING_VAULT_CONTRACT_ID
        value: CAMF3BS23WXYMA6W6E55VSX577GIPSRKJXJKLL2G46TABUQ4GIRGHIL3
      - key: DEMO_HONEST_AGENT
        value: GC654YOQQWSOYVDJKIYY726J3ULZBAQJYJXNUCXZPJ4EBCTFFLNTZOS5
      - key: DEMO_SYBIL_AGENT
        value: GAXCQ2B6MLJSP6IHB3DLMARUJMJLWMCEUV5ZMI4OHJ3FZGMYO55F5NLN
      - key: DEMO_FROM_LEDGER
        value: "3369652"
      - key: X402_EXCLUDE_ADDRESSES
        value: GDS55JGUTDAH43XQRQGYK5NTDIO57HFA5OP6EOQ3AZ2E3GG634A2ZD5L,GA6THKUY2XJZOBRFMEQMMEADSCQLCZ2QMQWAWMMDXBTE7SARKAXVH7TL,GA2YSWX54ZNO2E3AC74Q4MJRSH4I5EPBEFD52VSF4WWDHA2NX4YFTUOF,CD5RQFFYF57MLI3JI2PHUROMYFWLGDB7RPMGIK5JRWAO6NWHEUE3EC6C,CA7QGIAUGENZU3V63CVUT2N56X3ASZ774E3RCAHFZ2WKAQGOCKTDIQOA,CAMF3BS23WXYMA6W6E55VSX577GIPSRKJXJKLL2G46TABUQ4GIRGHIL3,GCUVT3UH4JFHAK7APFHU655SY5QC4JQGRWH5NPGUC3RXCIBYH2NTB2UB
      - key: SCORE_BAND_DIVISOR
        value: "1000"
      - key: OZ_API_KEY
        sync: false
      - key: FACILITATOR_URL
        value: https://channels.openzeppelin.com/x402/testnet
      - key: STRIPE_TEST_KEY
        sync: false
      - key: SEEDPHRASE
        sync: false
      - key: FAUCET_SECRET
        sync: false

  # Analyst and Reviewer — the same proven Scout-shaped agent (Express + x402
  # payment middleware + shared LLM brain + TrustLineAgent SDK), publicly
  # hosted so real testnet wallets can actually pay them, not just localhost.
  # NOTE: free-tier Render services sleep after ~15min idle, same as the
  # backend — the first request after a sleep will hang 30-60s.
  - type: web
    name: trustline-analyst
    runtime: node
    rootDir: agents
    buildCommand: npm install && (cd ../packages/agent-sdk && npm install && npm run build)
    startCommand: node analyst/server.mjs
    envVars:
      - key: ANALYST_WALLET_SECRET
        sync: false
      - key: ANALYST_WALLET_PUBLIC
        sync: false
      - key: OZ_API_KEY
        sync: false
      - key: FACILITATOR_URL
        value: https://channels.openzeppelin.com/x402/testnet
      - key: GROQ_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: TRUSTLINE_API
        value: https://fianza-3ecj.onrender.com
      - key: ANALYST_PRICE_USDC
        value: "0.3"
      # Keep-alive, hosted as a protected endpoint on THIS free web service
      # instead of a paid Render Cron Job — a free external pinger (cron-job.org,
      # UptimeRobot) hits GET /keep-alive-tick?token=... on a schedule. See
      # analyst/server.mjs and agents/keep-alive.mjs.
      - key: KEEPALIVE_TOKEN
        sync: false
      - key: CUSTOMER1_SECRET
        sync: false
      - key: CUSTOMER2_SECRET
        sync: false
      - key: CUSTOMER3_SECRET
        sync: false
      - key: ANALYST_URL
        value: https://trustline-analyst.onrender.com/research
      - key: REVIEWER_URL
        value: https://trustline-reviewer.onrender.com/review

  - type: web
    name: trustline-reviewer
    runtime: node
    rootDir: agents
    buildCommand: npm install && (cd ../packages/agent-sdk && npm install && npm run build)
    startCommand: node reviewer/server.mjs
    envVars:
      - key: REVIEWER_WALLET_SECRET
        sync: false
      - key: REVIEWER_WALLET_PUBLIC
        sync: false
      - key: OZ_API_KEY
        sync: false
      - key: FACILITATOR_URL
        value: https://channels.openzeppelin.com/x402/testnet
      - key: GROQ_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: TRUSTLINE_API
        value: https://fianza-3ecj.onrender.com
      - key: REVIEWER_PRICE_USDC
        value: "0.3"
